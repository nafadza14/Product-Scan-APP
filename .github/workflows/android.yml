name: Android

# Builds the Android app when native code or dependencies change. Web-only changes reach installed
# apps through live updates, so they do not need a new binary.
#   - Always: debug APK (artifact, install it on a phone for testing).
#   - When ANDROID_KEYSTORE_BASE64 is set: signed release AAB (artifact).
#   - When PLAY_SERVICE_ACCOUNT_JSON is also set: the AAB goes to the Google Play internal track.
# See docs/CI.md for the secrets.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets cannot be used in `if:` directly, so expose whether they exist.
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Web build settings baked into the bundled copy of the app.
      VITE_API_BASE: https://app.scanything.online
      VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
      VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
      VITE_PAYWALL_MODE: ${{ vars.VITE_PAYWALL_MODE }}
      VITE_AMAZON_TAG: ${{ vars.VITE_AMAZON_TAG }}
      VITE_SHOPEE_AFF_ID: ${{ vars.VITE_SHOPEE_AFF_ID }}
      # Same build id Vercel uses for this commit, so the bundled web app matches the live one.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version name from package.json
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (android)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scanything-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode upload keystore
        if: env.HAS_ANDROID_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: env.HAS_ANDROID_SIGNING == 'true' && github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          # Fail loudly if Gradle produced an unsigned bundle (e.g. a missing password secret).
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          echo "Built versionCode $VERSION_CODE, versionName $VERSION_NAME"

      - name: Upload release AAB
        if: env.HAS_ANDROID_SIGNING == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scanything-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play (internal track)
        if: env.HAS_ANDROID_SIGNING == 'true' && env.HAS_PLAY_UPLOAD == 'true' && github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: online.scanything.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          # Play only accepts "draft" until the app has been published once; set the repo
          # variable PLAY_RELEASE_STATUS=completed after that to roll out automatically.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
